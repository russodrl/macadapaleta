    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --bg-section: #111111;
            --accent-gold: #cd853f;
            --accent-red: #c0392b;
            --accent-ember: #e74c3c;
            --text-white: #f5f5f5;
            --text-muted: #999;
            --text-light: #ccc;
            --border-subtle: #222;
            --whatsapp-green: #25d366;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-white);
            overflow-x: hidden;
        }
        h1,h2,h3,h4 { font-family: 'Playfair Display', serif; }

        /* NAV */
        nav {
            position: fixed; top:0; left:0; right:0; z-index:1000;
            padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.4s ease;
            background: transparent;
        }
        nav.scrolled {
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(20px);
            box-shadow: 0 2px 30px rgba(0,0,0,0.5);
            padding: 0.7rem 2rem;
        }
        .nav-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem; font-weight: 700;
            color: var(--accent-gold);
            text-decoration: none;
        }
        .nav-logo span { color: var(--text-white); }
        .nav-links { display:flex; gap:2rem; list-style:none; }
        .nav-links a {
            color: var(--text-light); text-decoration:none;
            font-size: 0.9rem; font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }
        .nav-links a::after {
            content:''; position:absolute; bottom:-4px; left:0;
            width:0; height:2px; background:var(--accent-gold);
            transition: width 0.3s;
        }
        .nav-links a:hover { color:var(--accent-gold); }
        .nav-links a:hover::after { width:100%; }
        .nav-cta {
            background: var(--accent-red); color:#fff;
            padding: 0.6rem 1.4rem; border-radius:50px;
            text-decoration:none; font-weight:600; font-size:0.85rem;
            transition: all 0.3s;
        }
        .nav-cta:hover { background:var(--accent-ember); transform:scale(1.05); }
        .hamburger { display:none; cursor:pointer; flex-direction:column; gap:5px; }
        .hamburger span { width:25px; height:2px; background:var(--text-white); transition:0.3s; }

        /* HERO */
        .hero {
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            position:relative; text-align:center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a00 30%, #2a0f00 60%, #0a0a0a 100%);
            overflow:hidden;
        }
        .hero::before {
            content:''; position:absolute; inset:0;
            background: radial-gradient(ellipse at 50% 80%, rgba(205,133,63,0.15) 0%, transparent 60%);
        }
        .hero-flames {
            position:absolute; bottom:0; left:0; right:0; height:200px;
            background: linear-gradient(to top, rgba(192,57,43,0.1), transparent);
        }
        .hero-content { position:relative; z-index:2; max-width:800px; padding:2rem; }
        .hero-badge {
            display:inline-block; padding:0.4rem 1.2rem;
            border:1px solid var(--accent-gold); border-radius:50px;
            font-size:0.8rem; color:var(--accent-gold);
            letter-spacing:2px; text-transform:uppercase;
            margin-bottom:1.5rem;
            animation: fadeInDown 1s ease;
        }
        .hero h1 {
            font-size:clamp(2.5rem,6vw,4.5rem); line-height:1.1;
            margin-bottom:1rem; font-weight:900;
            animation: fadeInUp 1s ease 0.2s both;
        }
        .hero h1 .gold { color:var(--accent-gold); }
        .hero p {
            font-size:1.15rem; color:var(--text-muted);
            max-width:550px; margin:0 auto 2rem;
            animation: fadeInUp 1s ease 0.4s both;
        }
        .hero-buttons {
            display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;
            animation: fadeInUp 1s ease 0.6s both;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-red), #e74c3c);
            color:#fff; padding:1rem 2.5rem; border-radius:50px;
            text-decoration:none; font-weight:700; font-size:1rem;
            transition:all 0.3s; display:inline-flex; align-items:center; gap:0.5rem;
            box-shadow: 0 4px 20px rgba(192,57,43,0.4);
        }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(192,57,43,0.6); }
        .btn-secondary {
            background:transparent; color:var(--text-white);
            padding:1rem 2.5rem; border-radius:50px;
            border:2px solid var(--accent-gold);
            text-decoration:none; font-weight:600; font-size:1rem;
            transition:all 0.3s;
        }
        .btn-secondary:hover { background:var(--accent-gold); color:var(--bg-dark); }
        .hero-stats {
            display:flex; gap:3rem; justify-content:center; margin-top:3rem;
            animation: fadeInUp 1s ease 0.8s both;
        }
        .hero-stat { text-align:center; }
        .hero-stat .number {
            font-family:'Playfair Display',serif; font-size:2.5rem;
            font-weight:900; color:var(--accent-gold);
        }
        .hero-stat .label { font-size:0.8rem; color:var(--text-muted); margin-top:0.2rem; }

        /* SECTIONS */
        section { padding:6rem 2rem; }
        .section-header {
            text-align:center; margin-bottom:4rem;
        }
        .section-header .tag {
            display:inline-block; font-size:0.75rem; letter-spacing:3px;
            text-transform:uppercase; color:var(--accent-gold);
            margin-bottom:0.8rem; font-weight:600;
        }
        .section-header h2 {
            font-size:clamp(2rem,4vw,3rem); margin-bottom:1rem;
        }
        .section-header p {
            color:var(--text-muted); max-width:600px; margin:0 auto;
            font-size:1.05rem; line-height:1.7;
        }
        .container { max-width:1200px; margin:0 auto; }

        /* SOBRE */
        .sobre { background:var(--bg-section); }
        .sobre-grid {
            display:grid; grid-template-columns:1fr 1fr; gap:4rem; align-items:center;
        }
        .sobre-img {
            width:100%; height:450px; border-radius:16px;
            object-fit:cover;
            box-shadow:0 20px 60px rgba(0,0,0,0.5);
        }
        .sobre-text h3 {
            font-size:1.8rem; margin-bottom:1rem; color:var(--accent-gold);
        }
        .sobre-text p {
            color:var(--text-light); line-height:1.8; margin-bottom:1rem;
        }
        .sobre-features {
            display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:1.5rem;
        }
        .sobre-feature {
            display:flex; align-items:center; gap:0.7rem;
            padding:0.8rem; background:var(--bg-card); border-radius:10px;
        }
        .sobre-feature .icon { font-size:1.5rem; }
        .sobre-feature .text { font-size:0.9rem; font-weight:500; }

        /* DIFERENCIAIS */
        .diferenciais-grid {
            display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:2rem;
        }
        .diferencial-card {
            background:var(--bg-card); border:1px solid var(--border-subtle);
            border-radius:16px; padding:2.5rem; text-align:center;
            transition:all 0.4s; position:relative; overflow:hidden;
        }
        .diferencial-card::before {
            content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
            width:60px; height:3px; background:var(--accent-gold);
            border-radius:0 0 3px 3px;
        }
        .diferencial-card:hover {
            transform:translateY(-8px);
            border-color:var(--accent-gold);
            box-shadow:0 20px 40px rgba(205,133,63,0.1);
        }
        .diferencial-icon { font-size:3rem; margin-bottom:1.2rem; }
        .diferencial-card h3 {
            font-size:1.3rem; margin-bottom:0.8rem; color:var(--accent-gold);
        }
        .diferencial-card p {
            color:var(--text-muted); font-size:0.95rem; line-height:1.6;
        }

        /* CARDAPIO */
        .cardapio { background:var(--bg-section); }
        .cardapio-grid {
            display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:2rem;
        }
        .cardapio-card {
            background:var(--bg-card); border-radius:16px; overflow:hidden;
            border:1px solid var(--border-subtle);
            transition:all 0.4s;
        }
        .cardapio-card:hover {
            transform:translateY(-5px);
            box-shadow:0 15px 40px rgba(0,0,0,0.3);
        }
        .cardapio-img {
            width:100%; height:220px; object-fit:cover;
        }
        .cardapio-body { padding:1.5rem; }
        .cardapio-tag {
            display:inline-block; padding:0.3rem 0.8rem;
            background:rgba(205,133,63,0.15); color:var(--accent-gold);
            border-radius:50px; font-size:0.75rem; font-weight:600;
            margin-bottom:0.8rem;
        }
        .cardapio-card h3 { font-size:1.3rem; margin-bottom:0.5rem; }
        .cardapio-card p { color:var(--text-muted); font-size:0.9rem; line-height:1.5; }
        .cardapio-price {
            font-family:'Playfair Display',serif; font-size:1.5rem;
            color:var(--accent-gold); margin-top:0.8rem; font-weight:700;
        }

        /* PROMOCOES */
        .promos-grid {
            display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1.5rem;
        }
        .promo-card {
            background: linear-gradient(135deg, var(--bg-card), #1a1000);
            border:1px solid rgba(205,133,63,0.3);
            border-radius:16px; padding:2rem; text-align:center;
            position:relative; overflow:hidden;
        }
        .promo-card::after {
            content:''; position:absolute; top:-50%; right:-50%;
            width:100%; height:100%;
            background:radial-gradient(circle, rgba(205,133,63,0.05), transparent);
        }
        .promo-day {
            font-family:'Playfair Display',serif; font-size:1.1rem;
            color:var(--accent-gold); font-weight:700;
            text-transform:uppercase; letter-spacing:2px;
            margin-bottom:0.5rem;
        }
        .promo-card h3 { font-size:1.4rem; margin-bottom:0.5rem; }
        .promo-card p { color:var(--text-muted); font-size:0.9rem; }
        .promo-icon { font-size:2.5rem; margin-bottom:1rem; }

        /* REVIEWS */
        .reviews { background:var(--bg-section); }
        .reviews-header-info {
            display:flex; align-items:center; justify-content:center; gap:1.5rem;
            margin-bottom:3rem; flex-wrap:wrap;
        }
        .reviews-score {
            font-family:'Playfair Display',serif; font-size:4rem;
            font-weight:900; color:var(--accent-gold);
        }
        .reviews-stars { font-size:1.8rem; letter-spacing:2px; }
        .reviews-count { color:var(--text-muted); font-size:1rem; }
        .reviews-grid {
            display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:1.5rem;
        }
        .review-card {
            background:var(--bg-card); border:1px solid var(--border-subtle);
            border-radius:16px; padding:2rem;
            transition:all 0.3s;
        }
        .review-card:hover { border-color:rgba(205,133,63,0.3); transform:translateY(-3px); }
        .review-header { display:flex; align-items:center; gap:1rem; margin-bottom:1rem; }
        .review-avatar {
            width:48px; height:48px; border-radius:50%;
            background:linear-gradient(135deg, var(--accent-gold), var(--accent-red));
            display:flex; align-items:center; justify-content:center;
            font-weight:700; font-size:1.1rem; color:#fff;
        }
        .review-name { font-weight:600; font-size:0.95rem; }
        .review-date { font-size:0.8rem; color:var(--text-muted); }
        .review-stars { color:#f1c40f; margin-bottom:0.8rem; font-size:1rem; }
        .review-text { color:var(--text-light); font-size:0.9rem; line-height:1.7; font-style:italic; }
        .review-source {
            display:inline-flex; align-items:center; gap:0.4rem;
            margin-top:1rem; font-size:0.75rem; color:var(--text-muted);
        }
        .review-source img { height:14px; }

        /* LOCALIZACAO */
        .localizacao-grid {
            display:grid; grid-template-columns:1fr 1fr; gap:3rem; align-items:start;
        }
        .local-info-card {
            background:var(--bg-card); border:1px solid var(--border-subtle);
            border-radius:16px; padding:2.5rem;
        }
        .local-info-card h3 {
            font-size:1.5rem; margin-bottom:1.5rem; color:var(--accent-gold);
        }
        .local-item {
            display:flex; gap:1rem; margin-bottom:1.5rem; align-items:flex-start;
        }
        .local-item .icon { font-size:1.5rem; min-width:30px; }
        .local-item .label { font-size:0.8rem; color:var(--text-muted); margin-bottom:0.2rem; }
        .local-item .value { font-size:1rem; color:var(--text-white); font-weight:500; }
        .local-map {
            border-radius:16px; overflow:hidden;
            border:1px solid var(--border-subtle);
            height:100%; min-height:400px;
        }
        .local-map iframe { width:100%; height:100%; border:none; }

        /* CTA */
        .cta-section {
            background:linear-gradient(135deg, #1a0a00, #2a0f00, #1a0a00);
            text-align:center; position:relative; overflow:hidden;
        }
        .cta-section::before {
            content:''; position:absolute; inset:0;
            background:radial-gradient(ellipse at center, rgba(205,133,63,0.1), transparent 70%);
        }
        .cta-content { position:relative; z-index:2; }
        .cta-content h2 {
            font-size:clamp(2rem,4vw,3rem); margin-bottom:1rem;
        }
        .cta-content p {
            color:var(--text-muted); font-size:1.1rem; margin-bottom:2rem;
            max-width:500px; margin-left:auto; margin-right:auto;
        }

        /* FOOTER */
        footer {
            background:#050505; padding:4rem 2rem 2rem;
            border-top:1px solid var(--border-subtle);
        }
        .footer-grid {
            display:grid; grid-template-columns:2fr 1fr 1fr 1fr;
            gap:3rem; max-width:1200px; margin:0 auto;
            margin-bottom:3rem;
        }
        .footer-brand .nav-logo { font-size:1.6rem; display:block; margin-bottom:1rem; }
        .footer-brand p { color:var(--text-muted); font-size:0.9rem; line-height:1.6; }
        .footer-col h4 {
            font-family:'Inter',sans-serif; font-size:0.85rem;
            text-transform:uppercase; letter-spacing:2px;
            color:var(--accent-gold); margin-bottom:1rem;
        }
        .footer-col a {
            display:block; color:var(--text-muted); text-decoration:none;
            font-size:0.9rem; margin-bottom:0.6rem; transition:color 0.3s;
        }
        .footer-col a:hover { color:var(--accent-gold); }
        .footer-bottom {
            text-align:center; padding-top:2rem;
            border-top:1px solid var(--border-subtle);
            color:var(--text-muted); font-size:0.8rem;
        }

        /* WHATSAPP FLOAT */
        .whatsapp-float {
            position:fixed; bottom:2rem; right:2rem; z-index:999;
            width:60px; height:60px; border-radius:50%;
            background:var(--whatsapp-green);
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 4px 20px rgba(37,211,102,0.4);
            transition:all 0.3s; cursor:pointer;
            text-decoration:none;
        }
        .whatsapp-float:hover { transform:scale(1.1); box-shadow:0 6px 30px rgba(37,211,102,0.6); }
        .whatsapp-float svg { width:30px; height:30px; fill:#fff; }
        .whatsapp-pulse {
            position:absolute; inset:-4px; border-radius:50%;
            border:2px solid var(--whatsapp-green);
            animation: pulse 2s ease-in-out infinite;
        }

        /* ANIMATIONS */
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(30px); }
            to { opacity:1; transform:translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity:0; transform:translateY(-20px); }
            to { opacity:1; transform:translateY(0); }
        }
        @keyframes pulse {
            0%,100% { transform:scale(1); opacity:0.5; }
            50% { transform:scale(1.3); opacity:0; }
        }
        .fade-in {
            opacity:0; transform:translateY(30px);
            transition:opacity 0.8s ease, transform 0.8s ease;
        }
        .fade-in.visible { opacity:1; transform:translateY(0); }

        /* MOBILE */
        @media (max-width:768px) {
            .nav-links { display:none; }
            .hamburger { display:flex; }
            .nav-links.active {
                display:flex; flex-direction:column;
                position:absolute; top:100%; left:0; right:0;
                background:rgba(10,10,10,0.98); padding:2rem;
                gap:1.5rem; text-align:center;
            }
            .sobre-grid { grid-template-columns:1fr; }
            .sobre-img { height:300px; }
            .localizacao-grid { grid-template-columns:1fr; }
            .footer-grid { grid-template-columns:1fr 1fr; }
            .hero-stats { gap:1.5rem; }
            .hero-stat .number { font-size:1.8rem; }
            section { padding:4rem 1rem; }
        }
        @media (max-width:480px) {
            .footer-grid { grid-template-columns:1fr; }

<script>
    // Sticky Nav
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
        navbar.classList.toggle('scrolled', window.scrollY > 50);
    });

    // Fade-in on scroll
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            }
        });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(a => {
        a.addEventListener('click', e => {
            e.preventDefault();
            const target = document.querySelector(a.getAttribute('href'));
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                document.getElementById('navLinks').classList.remove('active');
            }
        });
    });
</script>
